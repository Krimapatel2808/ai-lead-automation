<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LeadFlow Test Website</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 50px 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            white-space: pre-wrap;
        }

        .success {
            background: #ecfdf5;
            color: #065f46;
        }

        .error {
            background: #fef2f2;
            color: #991b1b;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Request Information</h1>

    <p class="subtitle">
        Tell us what your business needs and our sales team will get back to you.
    </p>

    <form id="leadForm">

        <label for="name">Your name</label>

        <input
            type="text"
            id="name"
            placeholder="Rahul Sharma"
            required
        >

        <label for="company">Company</label>

        <input
            type="text"
            id="company"
            placeholder="ABC Technologies"
            required
        >

        <label for="message">How can we help?</label>

        <textarea
            id="message"
            placeholder="We need 200 licenses. Our budget is ₹10 lakh and we'd like to purchase this month."
            required
        ></textarea>

        <button type="submit">
            Submit enquiry
        </button>

    </form>

    <div id="result"></div>

</div>


<script>

const form = document.getElementById("leadForm");
const result = document.getElementById("result");

form.addEventListener("submit", async function(event) {

    event.preventDefault();

    result.style.display = "block";
    result.className = "";
    result.textContent = "Processing enquiry...";

    const leadData = {

        name: document.getElementById("name").value,

        company: document.getElementById("company").value,

        message: document.getElementById("message").value

    };

    try {

        const response = await fetch(
            "https://ai-lead-automation-cm4y.onrender.com/api/leads",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(leadData)
            }
        );

        const data = await response.json();

        if (!response.ok) {

            throw new Error(
                data.detail || "Something went wrong."
            );

        }

        result.className = "success";

        result.textContent =
            "Enquiry received successfully!\n\n" +
            "Our sales team will get back to you shortly.";

    } catch (error) {

        result.className = "error";

        result.textContent =
            "Could not connect to LeadFlow.\n\n" +
            error.message;

    }

});

</script>

</body>

</html>
